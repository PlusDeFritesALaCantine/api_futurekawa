services:
  postgres:
    image: postgres:15-alpine
    container_name: futurekawa-db
    restart: always
    environment:
      POSTGRES_DB: futurekawa
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: futurekawa-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
  api:
    build: .
    container_name: futurekawa-api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - API_PORT=8001
      - DATABASE_URL=postgresql+psycopg2://futurekawa:futurekawa@postgres:5432/futurekawa
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=alerts@futurekawa.local
      - BRAZIL_MANAGER_EMAIL=manager.brazil@futurekawa.local
    depends_on:
      - postgres
      - mailpit

volumes:
  postgres-data: