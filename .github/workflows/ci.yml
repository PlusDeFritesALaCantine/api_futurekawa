name: CI/CD Pipeline

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:
    branches: ["main", "test_moua"]
  
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: shared-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and run tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q

  build-and-push:
    runs-on: shared-runners
    needs: test
    permissions:
      contents: read
      packages: write
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      options: --user 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push with Kaniko
        run: |
          # 1. Création de l'authentification pour GHCR
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          mkdir -p /kaniko/.docker
          echo "{\"auths\":{\"${{ env.REGISTRY }}\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json

          # 2. Préparation des variables (casse minuscule)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # 3. Exécution du binaire déjà présent dans l'image
          /kaniko/executor \
            --context="${{ github.workspace }}" \
            --dockerfile="${{ github.workspace }}/Dockerfile" \
            --destination="$REPO_LOWER:latest" \
            --destination="$REPO_LOWER:sha-$SHORT_SHA" \
            --cache=true