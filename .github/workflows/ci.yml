name: CI/CD Pipeline

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:
    branches: ["main", "test_moua"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: shared-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and run tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q

  build-and-push:
    runs-on: shared-runners
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push with Kaniko via K8s Job
        run: |
          REPO_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          JOB_NAME="kaniko-build-${SHORT_SHA}-${RANDOM}"
          AUTH=$(echo -n "PlusDeFritesALaCantine:${{ secrets.GHCR_PAT }}" | base64 | tr -d '\n')
          kubectl create secret generic kaniko-secret \
            --from-literal=.dockerconfigjson="{\"auths\":{\"${{ env.REGISTRY }}\":{\"auth\":\"$AUTH\"}}}" \
            --type=kubernetes.io/dockerconfigjson \
            -n arc-runners --dry-run=client -o yaml | kubectl apply -f -
          kubectl run $JOB_NAME \
            --namespace=arc-runners \
            --restart=Never \
            --image=gcr.io/kaniko-project/executor:v1.23.2-debug \
            --overrides="{
              \"spec\": {
                \"restartPolicy\": \"Never\",
                \"containers\": [{
                  \"name\": \"kaniko\",
                  \"image\": \"gcr.io/kaniko-project/executor:v1.23.2-debug\",
                  \"args\": [
                    \"--context=git://github.com/PlusDeFritesALaCantine/api_futurekawa.git#refs/heads/main\",
                    \"--dockerfile=Dockerfile\",
                    \"--destination=$REPO_LOWER:latest\",
                    \"--destination=$REPO_LOWER:sha-$SHORT_SHA\",
                    \"--cache=true\"
                  ],
                  \"volumeMounts\": [{
                    \"name\": \"kaniko-secret\",
                    \"mountPath\": \"/kaniko/.docker/\"
                  }]
                }],
                \"volumes\": [{
                  \"name\": \"kaniko-secret\",
                  \"secret\": {
                    \"secretName\": \"kaniko-secret\"
                  }
                }]
              }
            }"
          echo "Attente du démarrage du Pod Kaniko..."
          kubectl wait --for=condition=Ready pod/$JOB_NAME -n arc-runners --timeout=60s
          kubectl logs -f pod/$JOB_NAME -n arc-runners
          kubectl delete pod $JOB_NAME -n arc-runners

  deploy:
    runs-on: shared-runners
    needs: build-and-push
    if: github.ref == 'refs/heads/*' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_rsa moua@${{ secrets.SERVER_HOST }} "mkdir -p /home/moua/$REPO_NAME"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" --exclude='.git' --exclude='.github' ./ moua@${{ secrets.SERVER_HOST }}:/home/moua/$REPO_NAME/