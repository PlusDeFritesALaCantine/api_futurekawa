name: CI/CD Pipeline

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:
    branches: ["main", "test_moua"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: shared-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and run tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q

  build-and-push:
    runs-on: shared-runners
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: PlusDeFritesALaCantine
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest sha-${{ github.sha }}
          containerfiles: ./Dockerfile
          registry: ${{ env.REGISTRY }}

  deploy:
    runs-on: shared-runners
    needs: build-and-push
    if: github.ref == 'refs/heads/*' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_rsa moua@${{ secrets.SERVER_HOST }} "mkdir -p /home/moua/$REPO_NAME"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" --exclude='.git' --exclude='.github' ./ moua@${{ secrets.SERVER_HOST }}:/home/moua/$REPO_NAME/